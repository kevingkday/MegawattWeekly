name = "megawattweekly"
main = "src/index.js"
compatibility_date = "2026-08-18"

[assets]
directory = "."
binding = "ASSETS"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

